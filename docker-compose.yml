services:
  pc-remote:
    build: .
    container_name: pc-remote
    restart: always
    ports:
      - "127.0.0.1:8765:8080"          # only this PC (and Tailscale) can reach it
    volumes:
      - C:/pc-remote-trigger:/trigger  # shared folder with the Windows helper
      - creds:/data                    # keeps your PIN, fingerprints and notification settings
    environment:
      SHUTDOWN_CMD: "touch /trigger/shutdown"
volumes:
  creds:
